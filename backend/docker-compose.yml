services:
  postgres:
    image: postgres:16-alpine
    container_name: bazaar-postgres
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
    ports:
      - "5432:5432"
    volumes:
      - bazaar-postgres-data:/var/lib/postgresql/data

volumes:
  bazaar-postgres-data:
