spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bazaar}
    username: ${DB_USERNAME:bazaar}
    password: ${DB_PASSWORD:bazaar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # HMAC-SHA256 secret, must be at least 32 bytes. Override via env var in real deployments.
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-env-1234567890}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  stripe:
    # Stripe test-mode secret key and webhook signing secret. Required to actually create
    # checkout sessions / verify webhooks; left blank by default for local dev.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  checkout:
    success-url: ${CHECKOUT_SUCCESS_URL:http://localhost:3000/checkout/success}
    cancel-url: ${CHECKOUT_CANCEL_URL:http://localhost:3000/checkout/cancel}
  cache:
    ttl-minutes: ${CACHE_TTL_MINUTES:10}
